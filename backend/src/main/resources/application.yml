spring:
  application:
    name: sbomscope

  datasource:
    # File-backed H2 under the user's home directory: SBOMscope's data outlives any
    # single run, and lives outside the working directory so it is never mistaken for
    # project output or accidentally committed.
    url: jdbc:h2:file:${user.home}/.sbomscope/db/sbomscope
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  servlet:
    multipart:
      # SBOMs for large projects are big JSON documents, but not unbounded.
      max-file-size: 64MB
      max-request-size: 64MB

  flyway:
    enabled: true
    locations: classpath:db/migration

sbomscope:
  scan:
    # Vulnerability data is only as good as its last refresh, and nothing here updates
    # on a timer. After this long, results are flagged as possibly outdated so the age
    # is visible rather than assumed.
    stale-after-days: 7
  # sbomscope.log and activity.jsonl live here. Ties to the same directory SbomFileStore
  # uses (sbomscope.data-directory), so tests that already isolate that property get log
  # isolation for free instead of needing a second override.
  logs-directory: ${sbomscope.data-directory:${user.home}/.sbomscope}/logs

server:
  port: 8080

logging:
  level:
    dev.sbomscope: INFO

# Local overrides belong in application-local.yml, which is git-ignored. There are no
# secrets today — the NVD API was dropped, and nothing else needs a credential — so keep
# it that way: never put one in this file.
---
spring:
  config:
    activate:
      on-profile: local
